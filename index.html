<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eee8dc">
<title>MILK / LOT 1012-31</title>
<meta name="description" content="LOT 1012-31">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Noto+Sans+JP:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="app">
  <section class="stage hero is-active" data-stage="hero">
    <div class="hero-bg"><i></i><i></i></div>
    <p class="hero-lot">LOT 1012–31</p>
    <div class="bottle-wrap">
      <img class="bottle-art" src="./bottle.svg" alt="牛乳びん">
      <img class="hero-cow" src="./cow.svg" alt="">
      <button class="hero-hit" data-next="inspection" aria-label="ラベルを見る"></button>
    </div>
    <p class="hero-note">ラベルを見る</p>
  </section>

  <section class="stage" data-stage="inspection">
    <article class="sheet">
      <div class="sheet-top">
        <div><p class="mono">LABEL CHECK / 01</p><h1>ラベルを確認</h1></div>
        <img src="./cow.svg" alt="" class="cow-mark">
      </div>
      <div class="simple-checks">
        <button class="simple-row is-ready" data-check="0"><span>01</span><b>ラベル</b><em>CHECK</em></button>
        <button class="simple-row" data-check="1" disabled><span>02</span><b>表示</b><em>—</em></button>
        <button class="simple-row" data-check="2" disabled><span>03</span><b>LOT 1012–31</b><em>—</em></button>
      </div>
      <button class="next-link" data-next="facts" hidden>裏ラベルへ <span>→</span></button>
    </article>
  </section>

  <section class="stage" data-stage="facts">
    <article class="sheet back-label">
      <div class="sheet-top">
        <div><p class="mono">MILK / LABEL B</p><h1>裏ラベル</h1></div>
        <span class="tiny-date">10.12</span>
      </div>
      <dl class="specs">
        <div><dt>種類別名称</dt><dd>牛乳</dd></div>
        <div><dt>原材料名</dt><dd>生乳 100%</dd></div>
        <div><dt>内容量</dt><dd>900 mL</dd></div>
        <div><dt>LOT</dt><dd>1012–31</dd></div>
        <div><dt>DATE</dt><dd>10.12</dd></div>
      </dl>
      <div class="barcode" aria-hidden="true"></div>
      <button class="next-link" data-next="finale">つづきを見る <span>→</span></button>
    </article>
  </section>

  <section class="stage" data-stage="finale">
    <article class="final-card">
      <p class="mono">10.12 / LOT 1012–31</p>
      <img src="./cow.svg" alt="" class="final-cow">
      <h1>31歳、おめでとう。</h1>
      <p>よい一年を。</p>
      <button class="restart" aria-label="最初から">↻</button>
    </article>
  </section>

  <nav class="dots" aria-hidden="true"><i class="active"></i><i></i><i></i><i></i></nav>
</main>
<script src="./script.js"></script>
</body>
</html>
