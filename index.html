<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#eee8dc" />
  <title>MILK / LOT 1012-31</title>
  <meta name="description" content="LOT 1012-31" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Noto+Sans+JP:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=20261006-4" />
</head>
<body>
  <main class="app">
    <section class="scene">
      <div class="bg-blur" aria-hidden="true">
        <i></i>
        <i></i>
      </div>

      <p class="lot">LOT 1012–31</p>

      <div class="bottle-wrap">
        <img class="bottle-art" src="./bottle.svg?v=20261006-4" alt="牛乳びん" />
        <img class="cow-on-label" src="./cow.svg?v=20261006-4" alt="" />
        <button class="label-hit" id="openLabel" aria-label="ラベルを見る"></button>
      </div>

      <p class="hint">CHECK LABEL</p>

      <div class="paper-stack" id="paperStack">
        <article class="paper ticket hidden" id="paperInspection">
          <div class="paper-head">
            <div>
              <p class="mono">QC / 10.12</p>
              <h1>検品票</h1>
            </div>
            <img src="./cow.svg?v=20261006-4" alt="" class="paper-cow" />
          </div>

          <div class="check-list">
            <button class="check-row is-ready" data-check="0">
              <span class="check-no">01</span>
              <b>外観</b>
              <em>□</em>
            </button>
            <button class="check-row" data-check="1" disabled>
              <span class="check-no">02</span>
              <b>表示</b>
              <em>□</em>
            </button>
            <button class="check-row" data-check="2" disabled>
              <span class="check-no">03</span>
              <b>LOT 1012–31</b>
              <em>□</em>
            </button>
          </div>

          <div class="qc-line">
            <span>CHECKED BY</span>
            <span class="line"></span>
            <span>10.12</span>
          </div>

          <button class="paper-link" id="toBackLabel" hidden>
            裏ラベルへ <span>→</span>
          </button>
        </article>

        <article class="paper ticket hidden" id="paperBackLabel">
          <div class="paper-head">
            <div>
              <p class="mono">BACK LABEL / B</p>
              <h1>裏ラベル</h1>
            </div>
            <span class="date-mark">10.12</span>
          </div>

          <dl class="specs">
            <div><dt>種類別名称</dt><dd>牛乳</dd></div>
            <div><dt>原材料名</dt><dd>生乳 100%</dd></div>
            <div><dt>内容量</dt><dd>900 mL</dd></div>
            <div><dt>LOT</dt><dd>1012–31</dd></div>
            <div><dt>DATE</dt><dd>10.12</dd></div>
          </dl>

          <div class="barcode" aria-hidden="true"></div>

          <div class="mini-stamp">QC<br>10.12</div>

          <button class="paper-link" id="toFinal">
            つづきを見る <span>→</span>
          </button>
        </article>

        <article class="paper final-note hidden" id="paperFinal">
          <p class="mono">LOT 1012–31 / 10.12</p>

          <div class="final-stamp">
            QC
            <span>CHECKED</span>
          </div>

          <img src="./cow.svg?v=20261006-4" alt="" class="final-cow" />

          <h1>31歳、おめでとう。</h1>
          <p>よい一年を。</p>

          <button class="restart" id="restart" aria-label="最初から">↻</button>
        </article>
      </div>
    </section>
  </main>

  <script src="./script.js?v=20261006-4"></script>
</body>
</html>
